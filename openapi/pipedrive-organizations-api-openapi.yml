  /organizations/{id}/followers:
    get:
      summary: List followers of an organization
      description: Lists the followers of an organization.
      x-token-cost: 20
      operationId: getOrganizationFollowers
      tags:
      - Organizations
      security:
      - api_key: []
      - oauth2:
        - contacts:read
        - contacts:full
      parameters:
      - in: path
        name: id
        description: The ID of the organization
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: GetAssociatedFollowersResponse
                type: object
                properties:
                  success:
                    type: boolean
                    description: If the request was successful or not
                  data:
                    type: array
                    description: The array of followers
                    items:
                      allOf:
                      - type: object
                        properties:
                          org_id:
                            type: integer
                            description: The ID of the organization
                      - type: object
                        properties:
                          user_id:
                            type: integer
                            description: The user ID of the follower related to the item
                          id:
                            type: integer
                            description: The ID of the follower
                          add_time:
                            type: string
                            format: date-time
                            description: The date and time of adding the follower to the item
                  additional_data:
                    type: object
                    properties:
                      pagination:
                        description: Pagination details of the list
                        type: object
                        properties:
                          start:
                            type: integer
                            description: Pagination start
                          limit:
                            type: integer
                            description: Items shown per page
                          more_items_in_collection:
                            type: boolean
                            description: Whether there are more list items in the collection than displayed
                          next_start:
                            type: integer
                            description: Next pagination start
              example:
                success: true
                data:
                - user_id: 100
                  id: 123
                  org_id: 77
                  add_time: '2020-09-08 08:17:52'
                additional_data:
                  pagination:
                    start: 0
                    limit: 100
                    more_items_in_collection: false
                    next_start: 100
    post:
      summary: Add a follower to an organization
      description: Adds a follower to an organization.
      x-token-cost: 10
      operationId: addOrganizationFollower
      tags:
      - Organizations
      security:
      - api_key: []
      - oauth2:
        - contacts:full
      parameters:
      - in: path
        name: id
        description: The ID of the organization
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              title: addOrganizationFollowerRequest
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: integer
                  description: The ID of the user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: AddOrganizationFollowerResponse
                type: object
                properties:
                  success:
                    type: boolean
                    description: If the request was successful or not
                  data:
                    allOf:
                    - type: object
                      properties:
                        org_id:
                          type: integer
                          description: The ID of the organization
                    - type: object
                      properties:
                        user_id:
                          type: integer
                          description: The user ID of the follower related to the item
                        id:
                          type: integer
                          description: The ID of the follower
                        add_time:
                          type: string
                          format: date-time
                          description: The date and time of adding the follower to the item
              example:
                success: true
                data:
                  user_id: 100
                  id: 123
                  org_id: 77
                  add_time: '2020-09-08 08:17:52'
  /organizations/{id}/followers/{follower_id}:
    delete:
      summary: Delete a follower from an organization
      description: Deletes a follower from an organization. You can retrieve the `follower_id` from the <a href="https://developers.pipedrive.com/docs/api/v1/Organizations#getOrganizationFollowers">List followers of an organization</a> endpoint.
      x-token-cost: 6
      operationId: deleteOrganizationFollower
      tags:
      - Organizations
      security:
      - api_key: []
      - oauth2:
        - contacts:full
      parameters:
      - in: path
        name: id
        description: The ID of the organization
        required: true
        schema:
          type: integer
      - in: path
        name: follower_id
        required: true
        schema:
          type: integer
        description: The ID of the relationship between the follower and the organization
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: DeleteOrganizationFollowerResponse
                type: object
                properties:
                  success:
                    type: boolean
                    description: If the request was successful or not
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: The ID of the follower that was deleted from the organization
              example:
                success: true
                data:
                  id: 123
