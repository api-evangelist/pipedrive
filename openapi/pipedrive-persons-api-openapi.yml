                  notes: Notes from contact sync
                  im:
                  - value: skypeusername
                    primary: true
                    label: skype
                  - value: whatsappusername
                    primary: false
                    label: whatsapp
                  birthday: '2000-12-31'
                  job_title: Manager
                  postal_address:
                    value: 123 Main St
                    country: USA
                    admin_area_level_1: CA
                    admin_area_level_2: Santa Clara
                    locality: Sunnyvale
