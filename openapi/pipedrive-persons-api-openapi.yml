  /persons/{id}/followers:
    get:
      summary: List followers of a person
      description: Lists the followers of a person.
      x-token-cost: 20
      operationId: getPersonFollowers
      tags:
      - Persons
      security:
      - api_key: []
      - oauth2:
        - contacts:read
        - contacts:full
      parameters:
      - in: path
        name: id
        description: The ID of the person
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: GetListFollowersResponse
                allOf:
                - title: baseResponse
                  type: object
                  properties:
                    success:
                      type: boolean
                      description: If the response is successful or not
                - type: object
                  properties:
                    data:
                      type: array
                      description: The list of followers
                      items:
                        type: object
                        properties:
                          user_id:
                            type: integer
                            description: The ID of the user
                          id:
                            type: integer
                            description: The ID of the user follower
                          deal_id:
                            type: integer
                            description: The ID of the deal which the follower was added to
                          add_time:
                            type: string
                            description: The date and time when the follower was added to the person
                    additional_data:
                      description: The additional data of the list
                      type: object
                      properties:
                        start:
                          type: integer
                          description: Pagination start
                        limit:
                          type: integer
                          description: Items shown per page
                        more_items_in_collection:
                          type: boolean
                          description: If there are more list items in the collection than displayed or not
              example:
                success: true
                data:
                - user_id: 123
                  id: 456
                  deal_id: 789
                  add_time: '2020-09-09 11:36:23'
                additional_data:
                  pagination:
                    start: 0
                    limit: 100
                    more_items_in_collection: true
    post:
      summary: Add a follower to a person
      description: Adds a follower to a person.
      x-token-cost: 10
      operationId: addPersonFollower
      tags:
      - Persons
      security:
      - api_key: []
      - oauth2:
        - contacts:full
      parameters:
      - in: path
        name: id
        description: The ID of the person
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              title: addPersonFollowerRequest
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: integer
                  description: The ID of the user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: AddPersonFollowerResponse
                allOf:
                - title: baseResponse
                  type: object
                  properties:
                    success:
                      type: boolean
                      description: If the response is successful or not
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        user_id:
                          type: integer
                          description: The ID of the user who was added as a follower to a person
                        id:
                          type: integer
                          description: The ID of the follower
                        person_id:
                          type: integer
                          description: The ID of the person to whom the follower was added
                        add_time:
                          type: string
                          description: 'The date and time when the follower was added to a person. Format: YYYY-MM-DD HH:MM:SS'
              example:
                success: true
                data:
                  user_id: 1
                  id: 2
                  person_id: 3
                  add_time: '2020-04-03 11:44:31'
  /persons/{id}/followers/{follower_id}:
    delete:
      summary: Delete a follower from a person
      description: Deletes a follower from a person.
      x-token-cost: 6
      operationId: deletePersonFollower
      tags:
      - Persons
      security:
      - api_key: []
      - oauth2:
        - contacts:full
      parameters:
      - in: path
        name: id
        description: The ID of the person
        required: true
        schema:
          type: integer
      - in: path
        name: follower_id
        required: true
        schema:
          type: integer
        description: The ID of the relationship between the follower and the person
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: DeletePersonResponse
                allOf:
                - title: baseResponse
                  type: object
                  properties:
                    success:
                      type: boolean
