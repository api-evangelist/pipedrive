      security:
      - api_key: []
      - oauth2:
        - deals:full
        - contacts:full
      parameters:
      - in: path
        name: id
        description: The ID of the note
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Delete a note
          content:
            application/json:
              schema:
                title: DeleteNoteResponse
                type: object
                properties:
                  success:
                    type: boolean
                    description: If the request was successful or not
                  data:
                    type: boolean
                    description: If the response is successful or not
              example:
                success: true
                data: true
