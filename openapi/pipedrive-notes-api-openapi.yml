    put:
      summary: Update a note
      description: Updates a note.
      x-token-cost: 10
      operationId: updateNote
      tags:
      - Notes
      security:
      - api_key: []
      - oauth2:
        - deals:full
        - contacts:full
      parameters:
      - in: path
        name: id
        description: The ID of the note
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              title: noteRequest
              type: object
              allOf:
              - type: object
                properties:
                  content:
                    type: string
                    description: The content of the note in HTML format. Subject to sanitization on the back-end.
              - type: object
                properties:
                  lead_id:
                    type: string
                    format: uuid
                    description: The ID of the lead the note will be attached to
                  deal_id:
                    type: integer
                    description: The ID of the deal the note will be attached to
                  person_id:
                    type: integer
                    description: The ID of the person the note will be attached to
                  org_id:
                    type: integer
                    description: The ID of the organization the note will be attached to
                  project_id:
                    type: integer
                    description: The ID of the project the note will be attached to
                  task_id:
                    type: integer
                    description: The ID of the task the note will be attached to
              - type: object
                properties:
                  user_id:
                    type: integer
                    description: The ID of the user who will be marked as the author of the note. Only an admin can change the author.
                  add_time:
                    type: string
                    description: 'The optional creation date & time of the note in UTC. Can be set in the past or in the future. Format: YYYY-MM-DD HH:MM:SS'
                  pinned_to_lead_flag:
                    allOf:
                    - title: numberBoolean
                      type: number
                      enum:
                      - 0
                      - 1
                    description: If set, the results are filtered by note to lead pinning state (`lead_id` is also required)
                  pinned_to_deal_flag:
                    allOf:
                    - title: numberBoolean
                      type: number
                      enum:
