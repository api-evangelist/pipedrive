                        title: Renovation deal
                      deal_count: 1
                      description: Full office renovation project
                      end_date: '2025-12-31'
                      custom_fields: []
                      notes: []
                additional_data:
                  next_cursor: eyJmaWVsZCI6ImlkIiwiZmllbGRWYWx1ZSI6Nywic29ydERpcmVjdGlvbiI6ImFzYyIsImlkIjo3fQ
