  /projects/{id}/changelog:
    get:
      summary: List updates about project field values
      description: Lists updates about field values of a project.
      x-token-cost: 10
      operationId: getProjectChangelog
      tags:
      - Projects
      security:
      - api_key: []
      - oauth2:
        - projects:read
        - projects:full
      parameters:
      - in: path
        name: id
        description: The ID of the project
        required: true
        schema:
          type: integer
      - in: query
