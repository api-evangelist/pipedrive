                    - title: Project
                      type: object
                      allOf:
                      - type: object
                        properties:
                          title:
                            description: The title of the project
                            type: string
                      - type: object
                        properties:
                          board_id:
                            description: The ID of the board this project is associated with
                            type: number
                          phase_id:
