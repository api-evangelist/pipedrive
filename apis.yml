- aid: pipedrive:pipedrive-permissionsets-api
  name: Pipedrive PermissionSets API
  description: >-
    Permission sets define what users in the account can do: which actions they are allowed to perform
    and which features they can access. Permission sets are app-specific, where apps are large parts of
    functionality, e.g., sales app, which allows accessing sales data, global permissions, which oversee
    cross-product features (for example contacts, insights, products) or account settings, which provides
    access to billing, user management, company settings and security center. Some permission sets with
    types such as admin and regular are pre-created for the account, while other custom ones can be created
    by users (depending on the tier the account is on).
