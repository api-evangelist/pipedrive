    will have one additional data field in addition to the one presented in the context of lead fields.
    For example, if there is a monetary field with the key `ffk9s9` stored on the account, `ffk9s9` would
    hold the numeric value of the field, and `ffk9s9_currency` would hold the ISO currency code that goes
    along with the numeric value. To find out which data fields are available, fetch one lead and list
    its keys.
  tags:
  - LeadFields
  tags_raw:
  - LeadFields
