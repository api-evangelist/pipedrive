- aid: pipedrive:pipedrive-activitytypes-api
  name: Pipedrive ActivityTypes API
  description: >-
    Activity types represent different kinds of activities that can be stored. Each activity type is presented
    to the user with an icon and a name. Additionally, a color can be defined (not implemented in the
    Pipedrive app as of today). Activity types are linked to activities via `ActivityType.key_string =
    Activity.type`. The `key_string` will be generated by the API based on the given name of the activity
    type upon creation, and cannot be changed. Activity types should be presented to the user in an ordered
    manner, using the `ActivityType.order_nr` value.
  tags:
  - ActivityTypes
  tags_raw:
  - ActivityTypes
